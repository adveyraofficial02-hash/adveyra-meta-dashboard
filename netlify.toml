[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/meta/auth"
  to = "/.netlify/functions/meta-auth"
  status = 200

[[redirects]]
  from = "/api/meta/callback"
  to = "/.netlify/functions/meta-callback"
  status = 200
